<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D18"/>
      <stop offset="100%" stop-color="#0F1726"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB84D"/>
      <stop offset="100%" stop-color="#FFD180"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(102,140,160,0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Tactical reticles -->
  <circle cx="20" cy="20" r="10" fill="none" stroke="rgba(255,184,77,0.3)" stroke-width="1"/>
  <line x1="20" y1="14" x2="20" y2="26" stroke="rgba(255,184,77,0.5)" stroke-width="1"/>
  <line x1="14" y1="20" x2="26" y2="20" stroke="rgba(255,184,77,0.5)" stroke-width="1"/>
  
  <text x="36" y="24" fill="#FFB84D" font-family="'Share Tech Mono', monospace" font-size="11" letter-spacing="1">ACV // ARMOR</text>
  <text x="380" y="24" text-anchor="end" fill="#668CA0" font-family="'Share Tech Mono', monospace" font-size="10">VAYU // SCHEMATIC</text>

  <!-- Vehicle Silhouette Outline -->
  <g transform="translate(40, 30)">
    
  <!-- Low Profile MBT Hull -->
  <polygon points="25,110 50,78 245,78 285,102 280,125 30,125" fill="rgba(255,184,77,0.25)" stroke="#FFB84D" stroke-width="2"/>
  <!-- Turret & 125mm Gun Barrel -->
  <path d="M 115,78 L 130,55 L 195,55 L 210,78 Z" fill="#FFB84D"/>
  <line x1="195" y1="64" x2="310" y2="64" stroke="#FFB84D" stroke-width="4"/>
  <circle cx="310" cy="64" r="3" fill="#FFD180"/>
  <!-- Continuous Track & Roadwheels -->
  <rect x="25" y="112" width="260" height="20" rx="10" fill="#080D18" stroke="#FFB84D" stroke-width="2.5"/>
  <circle cx="50" cy="122" r="7" fill="#FFB84D"/>
  <circle cx="85" cy="122" r="7" fill="#FFB84D"/>
  <circle cx="120" cy="122" r="7" fill="#FFB84D"/>
  <circle cx="155" cy="122" r="7" fill="#FFB84D"/>
  <circle cx="190" cy="122" r="7" fill="#FFB84D"/>
  <circle cx="225" cy="122" r="7" fill="#FFB84D"/>
  <circle cx="260" cy="122" r="7" fill="#FFB84D"/>

  </g>

  <!-- Ground Line -->
  <line x1="30" y1="165" x2="370" y2="165" stroke="rgba(102,140,160,0.3)" stroke-width="1.5" stroke-dasharray="4 2"/>
  <circle cx="370" cy="165" r="2.5" fill="#FFB84D"/>

  <!-- Subtitle Tag -->
  <rect x="30" y="172" width="120" height="18" rx="2" fill="rgba(102,140,160,0.12)" stroke="rgba(102,140,160,0.2)"/>
  <text x="36" y="185" fill="#DBE1E9" font-family="'Share Tech Mono', monospace" font-size="9">TRACKED UPGRADED MBT</text>
  <text x="370" y="185" text-anchor="end" fill="#7DA1AC" font-family="'Share Tech Mono', monospace" font-size="9">T-72M1 Ajeya MBT</text>
</svg>