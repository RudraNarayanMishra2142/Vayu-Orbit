<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D18"/>
      <stop offset="100%" stop-color="#0F1726"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB84D"/>
      <stop offset="100%" stop-color="#FFD180"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(102,140,160,0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Tactical reticles -->
  <circle cx="20" cy="20" r="10" fill="none" stroke="rgba(255,184,77,0.3)" stroke-width="1"/>
  <line x1="20" y1="14" x2="20" y2="26" stroke="rgba(255,184,77,0.5)" stroke-width="1"/>
  <line x1="14" y1="20" x2="26" y2="20" stroke="rgba(255,184,77,0.5)" stroke-width="1"/>
  
  <text x="36" y="24" fill="#FFB84D" font-family="'Share Tech Mono', monospace" font-size="11" letter-spacing="1">HET // HAULER</text>
  <text x="380" y="24" text-anchor="end" fill="#668CA0" font-family="'Share Tech Mono', monospace" font-size="10">VAYU // SCHEMATIC</text>

  <!-- Vehicle Silhouette Outline -->
  <g transform="translate(40, 30)">
    
  <!-- Cab -->
  <path d="M 15,120 L 15,45 L 60,45 L 85,85 L 90,120 Z" fill="rgba(255,184,77,0.25)" stroke="#FFB84D" stroke-width="2"/>
  <!-- Multi-Axle Lowbed Trailer -->
  <rect x="90" y="85" width="200" height="15" rx="2" fill="rgba(102,140,160,0.3)" stroke="#668CA0" stroke-width="2"/>
  <rect x="120" y="55" width="130" height="30" rx="3" fill="rgba(255,184,77,0.15)" stroke="#FFB84D" stroke-width="1.5" stroke-dasharray="4 2"/>
  <!-- Tractor Wheels -->
  <circle cx="35" cy="122" r="14" fill="#080D18" stroke="#FFB84D" stroke-width="2.5"/>
  <circle cx="68" cy="122" r="14" fill="#080D18" stroke="#FFB84D" stroke-width="2.5"/>
  <!-- Trailer Bogie Multi-Wheels -->
  <circle cx="185" cy="122" r="10" fill="#080D18" stroke="#FFB84D" stroke-width="2"/>
  <circle cx="210" cy="122" r="10" fill="#080D18" stroke="#FFB84D" stroke-width="2"/>
  <circle cx="235" cy="122" r="10" fill="#080D18" stroke="#FFB84D" stroke-width="2"/>
  <circle cx="260" cy="122" r="10" fill="#080D18" stroke="#FFB84D" stroke-width="2"/>

  </g>

  <!-- Ground Line -->
  <line x1="30" y1="165" x2="370" y2="165" stroke="rgba(102,140,160,0.3)" stroke-width="1.5" stroke-dasharray="4 2"/>
  <circle cx="370" cy="165" r="2.5" fill="#FFB84D"/>

  <!-- Subtitle Tag -->
  <rect x="30" y="172" width="120" height="18" rx="2" fill="rgba(102,140,160,0.12)" stroke="rgba(102,140,160,0.2)"/>
  <text x="36" y="185" fill="#DBE1E9" font-family="'Share Tech Mono', monospace" font-size="9">6x6 EQUIPMENT TRANSPORTER</text>
  <text x="370" y="185" text-anchor="end" fill="#7DA1AC" font-family="'Share Tech Mono', monospace" font-size="9">Super Stallion HET 6x6</text>
</svg>