<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D18"/>
      <stop offset="100%" stop-color="#0F1726"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB84D"/>
      <stop offset="100%" stop-color="#FFD180"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(102,140,160,0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Tactical reticles -->
  <circle cx="20" cy="20" r="10" fill="none" stroke="rgba(255,184,77,0.3)" stroke-width="1"/>
  <line x1="20" y1="14" x2="20" y2="26" stroke="rgba(255,184,77,0.5)" stroke-width="1"/>
  <line x1="14" y1="20" x2="26" y2="20" stroke="rgba(255,184,77,0.5)" stroke-width="1"/>
  
  <text x="36" y="24" fill="#FFB84D" font-family="'Share Tech Mono', monospace" font-size="11" letter-spacing="1">ACV // COMBAT</text>
  <text x="380" y="24" text-anchor="end" fill="#668CA0" font-family="'Share Tech Mono', monospace" font-size="10">VAYU // SCHEMATIC</text>

  <!-- Vehicle Silhouette Outline -->
  <g transform="translate(40, 30)">
    
  <!-- Sleek Amphibious Sloped Hull -->
  <path d="M 20,115 L 35,70 L 140,65 L 260,80 L 285,105 L 285,125 L 25,125 Z" fill="rgba(255,184,77,0.22)" stroke="#FFB84D" stroke-width="2"/>
  <!-- Autocannon Turret -->
  <rect x="120" y="45" width="45" height="20" rx="3" fill="#FFB84D"/>
  <line x1="165" y1="52" x2="250" y2="48" stroke="#FFB84D" stroke-width="3"/>
  <!-- Wheeled or Skirted Base -->
  <circle cx="65" cy="125" r="15" fill="#080D18" stroke="#FFB84D" stroke-width="2.5"/>
  <circle cx="110" cy="125" r="15" fill="#080D18" stroke="#FFB84D" stroke-width="2.5"/>
  <circle cx="155" cy="125" r="15" fill="#080D18" stroke="#FFB84D" stroke-width="2.5"/>
  <circle cx="200" cy="125" r="15" fill="#080D18" stroke="#FFB84D" stroke-width="2.5"/>
  <circle cx="245" cy="125" r="15" fill="#080D18" stroke="#FFB84D" stroke-width="2.5"/>

  </g>

  <!-- Ground Line -->
  <line x1="30" y1="165" x2="370" y2="165" stroke="rgba(102,140,160,0.3)" stroke-width="1.5" stroke-dasharray="4 2"/>
  <circle cx="370" cy="165" r="2.5" fill="#FFB84D"/>

  <!-- Subtitle Tag -->
  <rect x="30" y="172" width="120" height="18" rx="2" fill="rgba(102,140,160,0.12)" stroke="rgba(102,140,160,0.2)"/>
  <text x="36" y="185" fill="#DBE1E9" font-family="'Share Tech Mono', monospace" font-size="9">TRACKED AMPHIBIOUS ICV</text>
  <text x="370" y="185" text-anchor="end" fill="#7DA1AC" font-family="'Share Tech Mono', monospace" font-size="9">BMP-2 Sarath ICV</text>
</svg>